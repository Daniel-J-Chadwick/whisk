name = "whisk"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Production bindings. Do not add [env.production] — dashboard secrets stay in the Pages config.
# Preview isolation: scripts/isolate-preview-storage.sh adds [env.preview] with its own
# KV/R2 ids once CLOUDFLARE_API_TOKEN can create Workers KV + R2. Until then, preview
# deploys keep using these top-level production ids.
# KV Namespaces - create with: npx wrangler kv namespace create WHISK_KV
[[kv_namespaces]]
binding = "WHISK_KV"
id = "a46a8772abc64c7d831becf9e9179f99" # whisk-data

# R2 Bucket - create with: npx wrangler r2 bucket create whisk-photos
[[r2_buckets]]
binding = "WHISK_R2"
bucket_name = "whisk-photos"

# Workers AI binding (for generating embeddings)
[ai]
binding = "AI"

# Vectorize index (optional semantic search). Disabled until the index exists.
# To enable: npx wrangler vectorize create whisk-recipes --dimensions=768 --metric=cosine
# then uncomment the block below.
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "whisk-recipes"

[vars]
ENVIRONMENT = "production"
